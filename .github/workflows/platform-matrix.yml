name: platform-matrix

on:
  push:
    branches:
      - main
      - 'ci/**'
    tags: ['v*', 'Elpis*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-contracts:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - '3.11'
          - '3.12'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: python tools/setup.py --profile reference --dry-run

      - run: python -m pip install --upgrade pip

      - run: python -m pip install --require-hashes --only-binary=:all: -r qualification/locks/test-tools-py311-py312.lock

      - name: Install supported base dependency set
        run: python -m pip install -e .

      - name: Report resolved numerical stack
        run: python -c "import numpy, scipy, sys; print(sys.version); print('numpy=' + numpy.__version__); print('scipy=' + scipy.__version__)"

      - name: Prove optional Torch is not part of the base dependency set
        run: python -c "import importlib.util; assert importlib.util.find_spec('torch') is None; print('PLATFORM_MATRIX_TORCH_ABSENT')"

      - run: python -m pytest -q -p no:cacheprovider tests/test_platform_setup.py tests/test_semantic_refinement_contract.py tests/test_python_support_contract.py
