name: inference-native-r0

on:
  push:
    branches:
      - main
      - 'ci/**'
    tags:
      - 'Elpis*'
  pull_request:
    branches: [main]

permissions: {}

jobs:
  native-inference:
    name: Native-backed inference and R3 qualification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PYTHONPATH: runtime/R3/src:src

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Initialize bounded native workspace on runner
        run: |
          ELPIS_INFERENCE_WORKSPACE="${RUNNER_TEMP}/elpis-inference-native"
          ELPIS_FMS_FILE_LIBRARY="${ELPIS_INFERENCE_WORKSPACE}/native-build/libelpis_fms_file_assets_r0.so"
          TMPDIR="${ELPIS_INFERENCE_WORKSPACE}/tmp"
          mkdir -p "${ELPIS_INFERENCE_WORKSPACE}/native-build" "${TMPDIR}"
          {
            echo "ELPIS_INFERENCE_WORKSPACE=${ELPIS_INFERENCE_WORKSPACE}"
            echo "ELPIS_FMS_FILE_LIBRARY=${ELPIS_FMS_FILE_LIBRARY}"
            echo "TMPDIR=${TMPDIR}"
          } >> "${GITHUB_ENV}"

      - name: Install qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.0.2 numpy==1.26.4 scipy==1.17.1
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Verify exact native test authority
        run: python tools/verify_inference_native_locus.py --check

      - name: Build native file-asset provider in bounded workspace
        run: |
          mkdir -p "${ELPIS_INFERENCE_WORKSPACE}/native-build" "${TMPDIR}"
          cmake \
            -S native/hacf/file_assets_r0 \
            -B "${ELPIS_INFERENCE_WORKSPACE}/native-build" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "${ELPIS_INFERENCE_WORKSPACE}/native-build" --parallel
          test -f "${ELPIS_FMS_FILE_LIBRARY}"

      - name: Prove provider-backed core exact executed set
        run: |
          python tools/run_inference_native_locus.py             --section provider             --junitxml="${ELPIS_INFERENCE_WORKSPACE}/provider-sentinel.xml"             --record="${ELPIS_INFERENCE_WORKSPACE}/provider-execution.json"

      - name: Run complete native-backed inference and R3 exact executed locus
        run: |
          python tools/run_inference_native_locus.py             --section locus             --junitxml="${ELPIS_INFERENCE_WORKSPACE}/inference-native.xml"             --record="${ELPIS_INFERENCE_WORKSPACE}/locus-execution.json"
