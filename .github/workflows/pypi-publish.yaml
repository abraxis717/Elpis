name: pypi-publish

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: build tagged distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Verify checked-out tag identity
        shell: bash
        run: |
          set -euo pipefail
          test "Elpis$(cat VERSION)" = "${{ github.event.release.tag_name }}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "${{ github.event.release.tag_name }})"

      - name: Verify repository release identity
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_public_release.py --verify-repository-identity

      - name: Export immutable release tree
        shell: bash
        run: |
          set -euo pipefail
          release_tree="${RUNNER_TEMP}/elpis-release-tree"
          rm -rf "${release_tree}"
          mkdir -p "${release_tree}"
          git archive --format=tar "${{ github.event.release.tag_name }}" |
            tar -xf - -C "${release_tree}"
          test ! -e "${release_tree}/.git"
          test "Elpis$(cat "${release_tree}/VERSION")" = "${{ github.event.release.tag_name }}"

      - name: Verify exported public release
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/elpis-release-tree"
          python tools/verify_public_release.py

      - name: Build distributions from immutable export
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/python-package-distributions"
          mkdir -p "${RUNNER_TEMP}/python-package-distributions"
          cd "${RUNNER_TEMP}/elpis-release-tree"
          python -m build --outdir "${RUNNER_TEMP}/python-package-distributions"

      - name: Check distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m twine check "${RUNNER_TEMP}"/python-package-distributions/*

      - name: Upload distributions for isolated publish job
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: ${{ runner.temp }}/python-package-distributions/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish to PyPI with OIDC
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/elpisai
    permissions:
      id-token: write
    steps:
      - name: Download tagged distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
