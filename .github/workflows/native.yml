name: Native successor build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Export and validate pinned tree
        shell: bash
        run: |
          set -euo pipefail
          W=$(mktemp -d "$RUNNER_TEMP/elpis.XXXXXX")
          mkdir "$W/source"
          git archive HEAD | tar -xf - -C "$W/source"
          python3 -I -B "$W/source/policy.py" "$W/source"
          echo "ELPIS_CI_WORK=$W" >> "$GITHUB_ENV"
      - name: Bounded offline build (disposable runner only)
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          rustc --version
          cargo --version
          gcc --version
          sudo swapoff -a
          sudo systemd-run --wait --pipe --collect \
            -p "User=$(id -un)" -p MemoryMax=4G -p MemorySwapMax=0 \
            --setenv="PATH=$PATH" --setenv="HOME=$HOME" \
            /usr/bin/bash "$ELPIS_CI_WORK/source/build.sh" "$ELPIS_CI_WORK/build"
          test -x "$ELPIS_CI_WORK/build/elpis_cognitive_host"
          sha256sum "$ELPIS_CI_WORK/build/elpis_cognitive_host"
