[project]
name = "elpis-runtime-r3"
version = "0.0.1"
requires-python = ">=3.11,<3.13"
description = "Experimental fixture inference orchestration; no public runtime admission"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
